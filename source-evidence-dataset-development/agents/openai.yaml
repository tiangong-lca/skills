interface:
  display_name: "Source Evidence Dataset Development"
  short_description: "Top-level workflow for evidence-driven TIDAS data creation or update from documents, URLs, APIs, and literature"
  default_prompt: "Use $source-evidence-dataset-development for evidence-driven TIDAS work. Keep research/authorship local, then before remote work require CLI OAuth status/doctor-auth, separate account sessions, and human browser login only when required; never request credentials, codes, tokens, or API keys. Preserve evidence, queue, dry-run, closeout, and readback proof. For a registered public Foundry task, act only on its current work item and supplied structured actions; return input files without changing registered rows, reports, checkpoints or attempt state. Keep the standalone CLI procedure outside that managed task."
