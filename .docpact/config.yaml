version: 1
layout: repo
# Review note, 2026-09-11: Skills #98 adopts the exact final Foundry 0.1.8 lock (a1383982) and manifest (7119c909), independently verified against release abac241 and successful upstream run34553822939. Original CLI0.1.14 bootstrap bytes remain unchanged. Existing routes and ownership remain enforced.
# Review note, 2026-09-11: Skills #98 describes supported public reference-input snapshots and final-row native execution-contract selection. The qualified runtime schema gates availability; reviews/contracts grant no permission and consumed attempts retain original readback. No ownership or routing rule changes.
# Review note, 2026-09-11: Skills #98 adopts independently qualified CLI 0.1.14 / bcc5dbee5b909dbb912e09d99ca07e858d3d7cec for shared/copied launchers and CI. The separate Foundry 0.1.7 entry lock and its release expectations remain intact until the combined Foundry successor is independently qualified. Existing ownership and rules are unchanged.
# Current release proof, 2026-09-10: Skills #94 aligns wrappers and all three identical bundles to verified CLI 0.1.13 / cli-v0.1.13 / b5e209259d3bb06205b9af131b1c0edc3fba6da2, including its original permission-preserving POSIX bootstrap. The adjacent final Foundry 0.1.7 lock is byte-identical to the independently verified public release; the copied-entry native matrix proves the installed package.
# Release proof, 2026-09-02: Skills #91 pins verified CLI 0.1.8 / b4701984b4a86fe4680fa5995d0a0b6753dbdfd6; all three bundled launchers must remain byte-identical to their root authority.
# Review note, 2026-09-02: Skills #91 adds self-contained, byte-checked launcher bundles for the three hybrid-search packages and CLI-owned Production bootstrap guidance under existing skill/validation/doc routes; no auth runtime ownership moves into Skills.
# Review note, 2026-08-25: the existing validation-and-packaging contract now governs the pinned Node/pnpm package, frozen lockfile, shared CLI launcher/toolchain checks, and validation workflow; no separate rule was needed.
# Review note, 2026-09-01: Skills #89 advances every active shared/default wrapper, immutable CI checkout, local override contract, fixture, and current skill reference to OAuth-only CLI 0.1.7 / merge cb5be8f1e209f69570f4c7ef4ef29d61af52eed7. Existing validation, packaging, skill, and documentation routes own the change; no ownership or rule split is required.
lastReviewedAt: "2026-09-13"
lastReviewedCommit: "2f8c863015afcf0d2302af2a6c609feb6ebeca22"

catalog:
  repos:
    - id: skills
      path: .
      canonicalRepo: tiangong-lca/agent-skills
      entryDoc: AGENTS.md
      workflowDocs:
        - docs/agents/repo-validation.md
        - docs/agents/repo-architecture.md
      workspaceIntegrationRequired: true

ownership:
  domains:
    - id: repo-governance-and-docs
      paths:
        include:
          - AGENTS.md
          - README.md
          - README.zh-CN.md
          - .docpact/config.yaml
          - docs/agents/**
          - .github/workflows/ai-doc-lint.yml
      ownerRepo: skills
    - id: skill-packages
      paths:
        include:
          - "*/SKILL.md"
          - "*/agents/openai.yaml"
          - "*/scripts/**"
          - "*/references/**"
          - "*/assets/**"
      ownerRepo: skills
    - id: validation-and-packaging
      paths:
        include:
          - .claude-plugin/marketplace.json
          - .gitattributes
          - package.json
          - pnpm-lock.yaml
          - scripts/check-toolchain.mjs
          - scripts/lib/cli-launcher.mjs
          - scripts/validate-skills.mjs
          - test/**
          - .github/workflows/validate-skills.yml
      ownerRepo: skills

    - id: local-docpact-push-gate
      paths:
        include:
          - .githooks/**
          - scripts/docpact
          - scripts/docpact-gate.sh
          - scripts/install-git-hooks.sh
      ownerRepo: skills

coverage:
  include:
    - .claude-plugin/marketplace.json
    - .gitattributes
    - .githooks/**
    - scripts/docpact
    - scripts/docpact-gate.sh
    - scripts/install-git-hooks.sh
    - package.json
    - pnpm-lock.yaml
    - scripts/check-toolchain.mjs
    - scripts/lib/cli-launcher.mjs
    - AGENTS.md
    - README.md
    - README.zh-CN.md
    - .docpact/config.yaml
    - docs/agents/**
    - "*/SKILL.md"
    - "*/agents/openai.yaml"
    - "*/scripts/**"
    - "*/references/**"
    - "*/assets/**"
    - scripts/validate-skills.mjs
    - test/**
    - .github/workflows/validate-skills.yml
    - .github/workflows/ai-doc-lint.yml
  exclude:
    - .git/**
    - .github/scripts/**
    - .docpact/runs/**
    - node_modules/**

freshness:
  warn_after_commits: 40
  warn_after_days: 60
  critical_after_days: 120

routing:
  intents:
    local-docpact-gate:
      paths:
        - .githooks/pre-push
        - scripts/docpact
        - scripts/docpact-gate.sh
        - scripts/install-git-hooks.sh
    skill-wrapper:
      paths:
        - "*/SKILL.md"
        - "*/agents/openai.yaml"
    skill-package-assets:
      paths:
        - "*/scripts/**"
        - "*/references/**"
        - "*/assets/**"
    current-account-dataset-review:
      paths:
        - current-account-dataset-review/SKILL.md
        - current-account-dataset-review/agents/openai.yaml
        - current-account-dataset-review/scripts/**
    validation:
      paths:
        - package.json
        - pnpm-lock.yaml
        - scripts/check-toolchain.mjs
        - scripts/lib/cli-launcher.mjs
        - scripts/validate-skills.mjs
        - test/**
        - .github/workflows/validate-skills.yml
    repo-docs:
      paths:
        - AGENTS.md
        - README.md
        - README.zh-CN.md
        - .docpact/config.yaml
        - docs/agents/**
        - .github/workflows/ai-doc-lint.yml
    proof:
      paths:
        - docs/agents/repo-validation.md
        - package.json
        - pnpm-lock.yaml
        - scripts/check-toolchain.mjs
        - scripts/lib/cli-launcher.mjs
        - scripts/validate-skills.mjs
        - test/**
        - .github/workflows/validate-skills.yml
    root-integration:
      paths:
        - AGENTS.md

docInventory:
  include:
    - AGENTS.md
    - README.md
    - README.zh-CN.md
    - .docpact/config.yaml
    - docs/agents/repo-validation.md
    - docs/agents/repo-architecture.md

repo:
  id: skills
  owner: skills

rules:
  - id: skills-bootstrap-contract
    scope: repo
    repo: skills
    triggers:
      - path: AGENTS.md
        kind: doc-contract
      - path: .docpact/config.yaml
        kind: doc-ai-layer
      - path: docs/agents/repo-validation.md
        kind: deep-doc
      - path: docs/agents/repo-architecture.md
        kind: deep-doc
      - path: ai/**
        kind: legacy-doc-ai-layer
      - path: .github/scripts/ai-doc-lint.mjs
        kind: legacy-automation
      - path: .github/scripts/ai-doc-lint.test.mjs
        kind: legacy-automation
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
      - path: docs/agents/repo-architecture.md
        mode: review_or_update
    reason: Repo entry guidance, machine-readable routing, retained source docs, and legacy AI-doc removal must stay aligned.
  - id: skills-readme-contract
    scope: repo
    repo: skills
    triggers:
      - path: README.md
        kind: repo-landing
      - path: README.zh-CN.md
        kind: repo-landing
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: README.md
        mode: review_or_update
      - path: README.zh-CN.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
    reason: User-facing install and usage docs should stay aligned with the repo contract and skill packaging surface.
  - id: skills-wrapper-contract
    scope: repo
    repo: skills
    triggers:
      - path: "*/SKILL.md"
        kind: skill-contract
      - path: "*/agents/openai.yaml"
        kind: wrapper-contract
      - path: "*/scripts/**"
        kind: skill-script
      - path: "*/references/**"
        kind: skill-reference
      - path: "*/assets/**"
        kind: skill-asset
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-architecture.md
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
    reason: Skill packages are this repo's source of truth and must keep instruction, wrapper, and proof expectations aligned.
  - id: skills-validation-contract
    scope: repo
    repo: skills
    triggers:
      - path: .claude-plugin/marketplace.json
        kind: skill-marketplace
      - path: .gitattributes
        kind: immutable-bootstrap-bytes
      - path: package.json
        kind: package-contract
      - path: pnpm-lock.yaml
        kind: frozen-lockfile
      - path: scripts/check-toolchain.mjs
        kind: toolchain-validation
      - path: scripts/lib/cli-launcher.mjs
        kind: cli-launcher
      - path: scripts/validate-skills.mjs
        kind: validation-script
      - path: test/**
        kind: repo-test
      - path: .github/workflows/validate-skills.yml
        kind: validation-automation
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
      - path: docs/agents/repo-architecture.md
        mode: review_or_update
    reason: Validation changes alter the minimum proof expected for future skill work.
  - id: skills-doc-governance-ci
    scope: repo
    repo: skills
    triggers:
      - path: .github/workflows/ai-doc-lint.yml
        kind: automation
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
    reason: Documentation governance automation changes alter the maintenance gate and proof expectations.
  - id: skills-local-docpact-push-gate
    scope: repo
    repo: skills
    triggers:
      - path: .githooks/pre-push
        kind: local-git-hook
      - path: scripts/docpact
        kind: local-automation
      - path: scripts/docpact-gate.sh
        kind: local-automation
      - path: scripts/install-git-hooks.sh
        kind: local-automation
    requiredDocs:
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
    reason: Local push documentation governance gates must stay aligned with repo validation guidance and docpact configuration.
