name: validate-skills

on:
  pull_request:
    paths:
      - ".gitattributes"
      - "foundry-tidas-import/**"
      - "foundry-tidas-authoring/**"
      - "test/foundry-*.test.mjs"
      - ".github/workflows/validate-skills.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate (${{ matrix.os }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: windows-latest
            arch: x64
          - os: macos-latest
            arch: arm64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout skills
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Checkout tiangong-lca-cli
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: tiangong-lca/tiangong-cli
          ref: b5e209259d3bb06205b9af131b1c0edc3fba6da2
          path: .ci/tiangong-lca-cli

      - name: Set up pnpm 11.24.0 and Node 24.19.0
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.24.0
          runtime: node@24.19.0
          install: false
          cache: true

      - name: Install Skills validation package
        run: pnpm install --frozen-lockfile

      - name: Install and build CLI
        working-directory: .ci/tiangong-lca-cli
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Test Skills repository contracts
        env:
          FOUNDRY_INSTALL_PROOF_DIR: ${{ runner.temp }}/foundry-skill-install
        run: pnpm test

      - name: Preserve copied public Foundry install evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: foundry-skill-install-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/foundry-skill-install/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Validate exact published CLI fallback
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'x64'
        run: node process-hybrid-search/scripts/run-process-hybrid-search.mjs --published-cli --help

      - name: Validate skills
        env:
          TIANGONG_LCA_CLI_DIR: ${{ github.workspace }}/.ci/tiangong-lca-cli
        run: pnpm validate
